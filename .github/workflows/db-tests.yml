name: Database tests

# Builds a scratch Postgres from the live-schema snapshot, applies new
# migrations, and runs the RLS / college-isolation suites. Make this a
# required check on main so no change can leak one college's data to another.
on:
  pull_request:
    paths:
      - 'apps/api/supabase/**'
      - 'apps/api/scripts/test-db.sh'
      - 'apps/campus-api/**'
      - 'packages/assessment-core/**'
      - '.github/workflows/db-tests.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/supabase/**'
      - 'apps/campus-api/**'
      - 'packages/assessment-core/**'

jobs:
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Run database tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: bash apps/api/scripts/test-db.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Shared assessment logic tests
        run: pnpm --filter @repo/assessment-core test
      - name: Campus API integration tests (real Postgres + RLS)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pnpm --filter @repo/campus-api test
